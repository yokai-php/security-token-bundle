name: Prepare env & install dependencies

description: Set up PHP and install the dependencies for a Symfony version

inputs:
  php-version:
    description: PHP version to install
    required: true
  symfony-version:
    description: Symfony framework bundle version constraint
    required: true
  coverage-mode:
    description: Coverage driver to enable
    required: false
    default: 'none'

runs:
  using: "composite"
  steps:
    - name: "Setup PHP"
      uses: shivammathur/setup-php@v2
      with:
        coverage: ${{ inputs.coverage-mode }}
        php-version: ${{ inputs.php-version }}
    - name: "Install dependencies with composer"
      shell: bash
      run: |
        composer require --no-update "symfony/framework-bundle:${{ inputs.symfony-version }}"
        # Symfony 8.0 has no patched release; keep testing compatibility with this series.
        # This exception applies only to the CI installation, not to package consumers.
        if [[ "${{ inputs.symfony-version }}" == "8.0.*" ]]; then
          composer config --json audit.ignore '{"PKSA-jvt1-tggb-8w72": "Allow Symfony 8.0 compatibility tests in CI"}'
        fi
        composer update --no-interaction --no-progress
