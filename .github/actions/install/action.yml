name: Prepare env & install dependencies

description: Set up PHP and install the dependencies for a Symfony version

inputs:
  php-version:
    description: PHP version to install
    required: true
  symfony-version:
    description: Symfony framework bundle version constraint
    required: true
  coverage-mode:
    description: Coverage driver to enable
    required: false
    default: 'none'

runs:
  using: "composite"
  steps:
    - name: "Setup PHP"
      uses: shivammathur/setup-php@v2
      with:
        coverage: ${{ inputs.coverage-mode }}
        php-version: ${{ inputs.php-version }}
    - name: "Install dependencies with composer"
      shell: bash
      env:
        COMPOSER_NO_SECURITY_BLOCKING: '1'
      run: |
        composer require --quiet --no-update "symfony/config:${{ inputs.symfony-version }}"
        composer require --quiet --no-update "symfony/console:${{ inputs.symfony-version }}"
        composer require --quiet --no-update "symfony/dependency-injection:${{ inputs.symfony-version }}"
        composer require --quiet --no-update "symfony/framework-bundle:${{ inputs.symfony-version }}"
        composer require --quiet --no-update "symfony/http-foundation:${{ inputs.symfony-version }}"
        composer require --quiet --no-update "symfony/http-kernel:${{ inputs.symfony-version }}"
        composer require --quiet --no-update "symfony/event-dispatcher:${{ inputs.symfony-version }}" --dev
        composer require --quiet --no-update "symfony/yaml:${{ inputs.symfony-version }}" --dev
        composer update --no-interaction --no-progress
