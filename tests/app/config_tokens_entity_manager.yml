# Tokens stored with Doctrine ORM in a dedicated entity manager, while the default one uses auto mapping
framework:
    test: true
    secret: test

doctrine:
    dbal:
        connections:
            default:
                driver: pdo_sqlite
                memory: true
            tokens:
                driver: pdo_sqlite
                memory: true
    orm:
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                auto_mapping: true
            tokens:
                connection: tokens

yokai_security_token:
    orm:
        entity_manager: tokens
